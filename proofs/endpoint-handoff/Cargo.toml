[package]
name = "choreofix-handoff-check"
version = "0.1.0"
edition = "2024"
publish = false

[features]
projection-profile = []

[[example]]
name = "feature_delivery_projection"
required-features = ["projection-profile"]

[dependencies]
hibana = { path = "../../../hibana", version = "=0.10.0" }
hibana-wasip1-runtime = { path = "../../../hibana-wasip1-runtime" }
hibana-runtime = { path = "../../../hibana-runtime", version = "=0.1.0", features = ["host"] }
serde_json = "=1.0.154"

[dev-dependencies]
hibana-epf = { path = "../../../hibana-epf" }

[workspace]

# Match the production runner's offline-auditor compilation conditions.
# Retain assertions; this changes neither the source search nor its capacity.
[profile.dev.package.hibana-epf]
opt-level = 3
debug-assertions = true

[lints.rust]
unsafe_code = "deny"
long_running_const_eval = "forbid"
