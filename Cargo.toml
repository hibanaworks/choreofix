[package]
name = "choreofix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana-runtime = { git = "https://github.com/hibanaworks/hibana-runtime", rev = "09a803afdfb45945febed46145a68ff92a03d9e4", features = ["host"] }
hibana = { path = "../hibana", version = "=0.10.0" }
hibana-wasip1-runtime = { path = "../hibana-wasip1-runtime" }
serde_json = "1.0.154"

[dev-dependencies]
hibana-epf = { path = "../hibana-epf" }

[lints.rust]
unsafe_code = "deny"
long_running_const_eval = "forbid"
