[package]
name = "choreofix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana-runtime = { git = "https://github.com/hibanaworks/hibana-runtime", rev = "09a803afdfb45945febed46145a68ff92a03d9e4", features = ["host"] }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "a4d48cdc4b4d42110d3d7a3fe9fe172efd91c3e0", version = "=0.10.0" }
hibana-wasip1-runtime = { git = "https://github.com/hibanaworks/hibana-wasip1-runtime", rev = "b5d1f9828263301797603eb225212a1f36e9b89a" }
serde_json = "1.0.154"

[dev-dependencies]
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "e0690aa120fd8a3e73bf24e5e68adeb29066e946" }

[lints.rust]
unsafe_code = "deny"
long_running_const_eval = "forbid"
