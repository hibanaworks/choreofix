[package]
name = "choreofix"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana-runtime = { git = "https://github.com/hibanaworks/hibana-runtime", rev = "09a803afdfb45945febed46145a68ff92a03d9e4", features = ["host"] }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "724f3e3e6e74b5d71ced86b1a0f007ba26177969", version = "=0.10.0" }
hibana-wasip1-runtime = { git = "https://github.com/hibanaworks/hibana-wasip1-runtime", rev = "82253a5f89246baa081a5c6581f09e9c0cbb918e" }
serde_json = "1.0.154"

[dev-dependencies]
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "0266f003d604f5790fe349565827a6210dd13826" }

[lints.rust]
unsafe_code = "deny"
long_running_const_eval = "forbid"

[profile.test.package.hibana-epf]
opt-level = 2
debug-assertions = true
overflow-checks = true
