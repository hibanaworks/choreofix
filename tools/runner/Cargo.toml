[package]
name = "choreofix-experiments"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
hibana-runtime = { git = "https://github.com/hibanaworks/hibana-runtime", rev = "09a803afdfb45945febed46145a68ff92a03d9e4", features = ["host"] }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "a4d48cdc4b4d42110d3d7a3fe9fe172efd91c3e0", version = "=0.10.0", default-features = false }
hibana-epf = { git = "https://github.com/hibanaworks/hibana-epf", rev = "e0690aa120fd8a3e73bf24e5e68adeb29066e946" }
choreofix-inputs = { path = "../inputs" }
pyo3 = { version = "=0.30.1", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

# The offline source search is exercised in ordinary debug/test runs too.
# Keep the same assertions and arithmetic checks while optimizing its loops.
[profile.dev.package.hibana-epf]
opt-level = 3
debug-assertions = true
overflow-checks = true
