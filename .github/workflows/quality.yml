name: quality
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYO3_PYTHON: ${{ github.workspace }}/choreofix/.venv/bin/python
    defaults:
      run:
        working-directory: choreofix
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: choreofix
          submodules: true
      - name: Select the current core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hibanaworks/hibana
          ref: main
          path: hibana
      - name: Select the current WASI runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hibanaworks/hibana-wasip1-runtime
          ref: main
          path: hibana-wasip1-runtime
      - name: Select the current EPF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hibanaworks/hibana-epf
          ref: main
          path: hibana-epf
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install Rust and the guest target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain stable wasm32-wasip1
      - name: Select the locked core's memory guard
        shell: bash
        run: |
          set -euo pipefail
          core_manifest="$(cargo +stable metadata --locked --format-version 1 | jq -er '
            [.packages[] | select(.name == "hibana")] |
            if length == 1 then .[0].manifest_path else error("expected one selected Hibana") end
          ')"
          guard="$(dirname "$core_manifest")/.github/scripts/lib/resource_guard.sh"
          test -f "$guard"
          printf 'HIBANA_RESOURCE_GUARD=%s\n' "$guard" >> "$GITHUB_ENV"
      - name: Restore the recorded upstream sources
        run: >-
          bash "$HIBANA_RESOURCE_GUARD"
          cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- restore
      - name: Install the locked Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Check projected task implementations
        run: |
          bash "$HIBANA_RESOURCE_GUARD" bash -euo pipefail <<'CHECKS'
          cargo +stable fmt --check
          .venv/bin/python -m unittest discover -s benchmark/tests -v
          cargo +stable fmt --manifest-path tools/inputs/Cargo.toml --check
          cargo +stable test --locked --manifest-path tools/inputs/Cargo.toml
          cargo +stable clippy --locked --manifest-path tools/inputs/Cargo.toml --all-targets -- -D warnings
          cargo +stable fmt --manifest-path tools/runner/Cargo.toml --check
          cargo +stable test --locked --manifest-path tools/runner/Cargo.toml
          cargo +stable test --locked --manifest-path tools/runner/Cargo.toml process::tests::runtime_shutdown_completes_pending_and_queued_shared_channel_replies -- --exact --ignored --test-threads=1
          cargo +stable clippy --locked --manifest-path tools/runner/Cargo.toml --all-targets -- -D warnings
          cargo +stable fmt --manifest-path vendor/hibana-wash/Cargo.toml --check
          cargo +stable test --locked --manifest-path vendor/hibana-wash/Cargo.toml --lib
          cargo +stable test --locked
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --lib handoff::
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test manufacturing
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test tool_cabinet -- --skip shell:: --test-threads=1
          cargo +stable clippy --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test tool_cabinet -- -D warnings
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test regulatory_discovery -- --skip shell:: --test-threads=1
          cargo +stable clippy --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test regulatory_discovery -- -D warnings
          cargo +stable clippy --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test multi_round_discovery -- -D warnings
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test research_paper research_paper:: -- --test-threads=1
          cargo +stable clippy --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test research_paper -- -D warnings
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test kitchen kitchen_ -- --test-threads=1
          cargo +stable clippy --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test kitchen -- -D warnings
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test repository_arguments implementation_arguments_retain_actual_source_bytes_and_reject_other_fields -- --exact
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test repository_arguments test_and_ci_arguments_keep_their_distinct_targets -- --exact
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test feature_delivery feature_delivery_
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test feature_delivery_whole feature_delivery_whole_execution_retries_and_returns_every_resource -- --exact
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test feature_delivery_source feature_delivery_whole_source
          cargo +stable test --locked --manifest-path proofs/endpoint-handoff/Cargo.toml --test feature_delivery_data merge_data_requires_the_exact_candidate_approval_and_integrated_base -- --exact
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable clippy --locked --manifest-path vendor/hibana-wash/Cargo.toml --target wasm32-wasip1 --release -- -D warnings
          CHECKS
      - name: Check the actual WASI and task effect boundary
        run: |
          bash "$HIBANA_RESOURCE_GUARD" bash -euo pipefail <<'CHECKS'
          cargo +stable build --locked --manifest-path tools/runner/Cargo.toml
          tools/runner/target/debug/choreofix-experiments --qualify-wasi "$PWD/output/wasi-boundary"
          cargo +stable test --locked --manifest-path tools/runner/Cargo.toml oracle::tests::original_tool_exception_reaches_rust_without_effects_or_a_hung_reply -- --ignored --test-threads=1 --nocapture
          cargo +stable test --locked --manifest-path tools/runner/Cargo.toml oracle::tests::codebase_simulator_allows_independent_work_and_reports_shared_module_overlap -- --ignored --test-threads=1 --nocapture
          cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- verify
          cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- matrix --check
          CHECKS
      - name: Inspect hibana-wash imports and memory
        run: >-
          bash "$HIBANA_RESOURCE_GUARD"
          cargo +stable run --locked --manifest-path tools/inputs/Cargo.toml -- wash
          vendor/hibana-wash/target/wasm32-wasip1/release/hibana-wash.wasm > wash-profile.json
      - name: Retain direct WASI boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: direct-wasi-boundary
          path: |
            choreofix/output/wasi-boundary/
            choreofix/wash-profile.json
          if-no-files-found: ignore
